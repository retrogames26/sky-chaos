name: Sky Chaos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sky-chaos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build production bundle
        run: npm run build
